<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كاتب المقالات — عربي ⇄ English</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f5c4d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كاتب المقالات">
<style>
  :root{
    --bg:#f4f1ea; --card:#fff; --ink:#1f2933; --muted:#6b7280; --line:#e5e0d5;
    --accent:#0f5c4d; --accent2:#c08a2e; --soft:#e8f2ef; --danger:#b42318;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
  header{background:var(--accent);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0;flex:1}
  header small{opacity:.8}
  #btnInstall{display:none;background:var(--accent2);color:#fff;border-color:var(--accent2)}
  .wrap{max-width:1300px;margin:0 auto;padding:16px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  button,select{font-family:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    padding:8px 12px;border-radius:8px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.gold{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  button.danger{color:var(--danger)}
  #btnMode{font-weight:700;border:2px solid var(--accent);color:var(--accent)}
  label.switch{display:flex;align-items:center;gap:6px;font-size:14px;background:var(--card);border:1px solid var(--line);padding:7px 10px;border-radius:8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:850px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:480px}
  .panel-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .panel-head b{font-size:15px}
  .count{font-size:12px;color:var(--muted)}
  .rtl{direction:rtl;text-align:right;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
  .ltr{direction:ltr;text-align:left;font-family:Georgia,"Times New Roman",serif}
  input.title{border:none;border-bottom:1px solid var(--line);padding:14px;font-size:20px;font-weight:700;outline:none;width:100%}
  textarea{flex:1;border:none;resize:vertical;padding:14px;font-size:18px;line-height:1.9;outline:none;min-height:380px}
  .out-title{padding:14px;font-size:20px;font-weight:700;border-bottom:1px solid var(--line);min-height:56px}
  .out-body{padding:14px;font-size:17px;line-height:1.85;flex:1;white-space:pre-wrap;overflow:auto}
  .placeholder{color:#aaa;font-style:italic}
  .status{font-size:13px;color:var(--muted);min-height:20px;margin:6px 2px}
  .status.err{color:var(--danger)}
  .tabs{display:flex;gap:6px;margin:18px 0 10px;flex-wrap:wrap}
  .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .learn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:16px;line-height:1.7;width:46%}
  td.act{width:8%;text-align:center;white-space:nowrap}
  tr:hover td{background:var(--soft)}
  .hide-tr td.tr span{filter:blur(6px);cursor:pointer;transition:.2s}
  .hide-tr td.tr span.shown{filter:none}
  .list{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px}
  .item:last-child{border-bottom:none}
  .item .t{font-weight:700}
  .item .d{font-size:12px;color:var(--muted)}
  .empty{padding:20px;text-align:center;color:var(--muted)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;font-size:14px;z-index:9}
  .toast.on{opacity:.92}
  .hint{font-size:13px;color:var(--muted);margin:4px 2px 10px}
  @media print{
    header,.toolbar,.tabs,#learnBox,#listBox,.status,.hint,.panel-head button,.panel-head select{display:none!important}
    .grid{grid-template-columns:1fr 1fr}
    .panel{border:none;min-height:0}
  }
</style>
</head>
<body>
<header>
  <h1>✍️ كاتب المقالات — عربي ⇄ English</h1>
  <small id="subtitle">اكتب بالعربي وتظهر الترجمة الإنجليزية مباشرة</small>
  <button id="btnInstall">📲 تثبيت التطبيق</button>
</header>

<div class="wrap">
  <div class="toolbar">
    <button id="btnMode" title="تبديل اتجاه الترجمة">⇄ عربي ← English</button>
    <button class="primary" id="btnTranslate">🔄 ترجم الآن</button>
    <label class="switch"><input type="checkbox" id="auto" checked> ترجمة تلقائية</label>
    <button id="btnNew">📄 جديد</button>
    <button id="btnSave" class="gold">💾 حفظ</button>
    <button id="btnCopyOut">📋 نسخ الترجمة</button>
    <button id="btnCopyBoth">📋 نسخ الاثنين</button>
    <button id="btnWord">⬇️ Word</button>
    <button id="btnHtml">⬇️ HTML</button>
    <button id="btnPrint">🖨️ طباعة</button>
  </div>
  <div class="status" id="status"></div>

  <div class="grid">
    <!-- النص الأصلي -->
    <div class="panel">
      <div class="panel-head">
        <b id="srcLabel">المقال بالعربية</b>
        <span class="count" id="srcCount"></span>
      </div>
      <input class="title" id="srcTitle">
      <textarea id="srcText"></textarea>
    </div>

    <!-- الترجمة -->
    <div class="panel">
      <div class="panel-head" id="outHead">
        <b id="outLabel">English Translation</b>
        <span>
          <button id="btnSpeakAll" title="استماع للنص الإنجليزي">🔊 Listen</button>
          <button id="btnStop" title="إيقاف">⏹</button>
          <select id="rate" title="سرعة القراءة">
            <option value="0.7">بطيء</option>
            <option value="0.9" selected>متوسط</option>
            <option value="1.1">عادي</option>
          </select>
        </span>
      </div>
      <div class="out-title" id="outTitle"></div>
      <div class="out-body" id="outText"></div>
      <div class="panel-head" style="border-top:1px solid var(--line);border-bottom:none">
        <span class="count" id="outCount"></span>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="active" data-tab="learnBox">🎓 وضع التعلّم (جملة بجملة)</button>
    <button data-tab="listBox">📚 مقالاتي المحفوظة</button>
  </div>

  <div id="learnBox">
    <div class="hint">كل جملة مع ترجمتها. اضغط 🔊 لسماع النطق الإنجليزي، أو فعّل "أخفِ الترجمة" لتختبر نفسك ثم اضغط على الجملة لكشفها.</div>
    <div class="toolbar">
      <button class="primary" id="btnBuildLearn">⚙️ جهّز الجمل</button>
      <label class="switch"><input type="checkbox" id="hideTr"> أخفِ الترجمة (اختبر نفسك)</label>
    </div>
    <div class="learn" id="learnTable"><div class="empty">اكتب مقالك ثم اضغط "جهّز الجمل".</div></div>
  </div>

  <div id="listBox" style="display:none">
    <div class="list" id="savedList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const srcTitle=$('srcTitle'), srcText=$('srcText'), outTitle=$('outTitle'), outText=$('outText'), statusEl=$('status');

/* ========== اتجاه الترجمة ========== */
const MODES = {
  'ar-en': { sl:'ar', tl:'en', srcDir:'rtl', outDir:'ltr',
    btn:'⇄ عربي ← English', sub:'اكتب بالعربي وتظهر الترجمة الإنجليزية مباشرة',
    srcLabel:'المقال بالعربية', outLabel:'English Translation',
    titlePh:'عنوان المقال...', textPh:'ابدأ كتابة مقالك هنا... كل فقرة في سطر مستقل.',
    outTitlePh:'Title...', outTextPh:'The translation will appear here...' },
  'en-ar': { sl:'en', tl:'ar', srcDir:'ltr', outDir:'rtl',
    btn:'⇄ English ← عربي', sub:'اكتب بالإنجليزي وتظهر الترجمة العربية مباشرة',
    srcLabel:'Article in English', outLabel:'الترجمة العربية',
    titlePh:'Article title...', textPh:'Start writing your article here... one paragraph per line.',
    outTitlePh:'العنوان...', outTextPh:'ستظهر الترجمة هنا...' }
};
let mode = 'ar-en';
try{ mode = localStorage.getItem('ar_en_mode') || 'ar-en'; }catch(e){}
const M = () => MODES[mode];

const cache = new Map();
let currentId = null, timer = null, lastOut = {title:'', body:''};

function applyMode(){
  const m = M();
  $('btnMode').textContent = m.btn;
  $('subtitle').textContent = m.sub;
  $('srcLabel').textContent = m.srcLabel;
  $('outLabel').textContent = m.outLabel;
  srcTitle.placeholder = m.titlePh; srcText.placeholder = m.textPh;
  [srcTitle, srcText].forEach(el => { el.className = el.className.replace(/\b(rtl|ltr)\b/g,'').trim() + ' ' + m.srcDir; el.dir = m.srcDir; });
  [outTitle, outText, $('outHead')].forEach(el => { el.classList.remove('rtl','ltr'); el.classList.add(m.outDir); });
  $('outHead').dir = m.outDir;
  showOut();
  updateCounts();
}
function showOut(){
  const m = M();
  if(lastOut.title) outTitle.textContent = lastOut.title; else outTitle.innerHTML = `<span class="placeholder">${m.outTitlePh}</span>`;
  if(lastOut.body.trim()) outText.textContent = lastOut.body; else outText.innerHTML = `<span class="placeholder">${m.outTextPh}</span>`;
}
$('btnMode').onclick = () => {
  const hasText = srcTitle.value.trim() || srcText.value.trim();
  // عند التبديل: تصبح الترجمة هي النص الأصلي (لو موجودة) لتسهيل المراجعة العكسية
  const oldSrc = {title:srcTitle.value, body:srcText.value};
  mode = mode === 'ar-en' ? 'en-ar' : 'ar-en';
  try{ localStorage.setItem('ar_en_mode', mode); }catch(e){}
  if(hasText && lastOut.body.trim()){
    srcTitle.value = lastOut.title; srcText.value = lastOut.body;
    lastOut = {title:oldSrc.title, body:oldSrc.body};
  }
  currentId = null;
  applyMode();
  $('learnTable').innerHTML='<div class="empty">اكتب مقالك ثم اضغط "جهّز الجمل".</div>';
  toast(mode==='ar-en' ? 'الترجمة الآن: من العربي إلى الإنجليزي' : 'الترجمة الآن: من الإنجليزي إلى العربي');
};

/* ========== الترجمة ========== */
// الأولى: Google Translate (مجاني بدون مفتاح) — البديل: MyMemory
async function googleTr(text, sl, tl){
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=` + encodeURIComponent(text);
  const r = await fetch(url);
  if(!r.ok) throw new Error('google '+r.status);
  const d = await r.json();
  return d[0].map(x => x[0]).join('');
}
async function myMemoryTr(text, sl, tl){
  const out = [];
  for(const p of splitBy(text, 450)){
    const r = await fetch(`https://api.mymemory.translated.net/get?langpair=${sl}|${tl}&q=` + encodeURIComponent(p));
    const d = await r.json();
    if(d.responseStatus != 200) throw new Error('mymemory');
    out.push(d.responseData.translatedText);
  }
  return out.join(' ');
}
function splitBy(text, max){
  if(text.length <= max) return [text];
  const sents = text.split(/(?<=[.!؟?،;,])\s+/);
  const out=[]; let cur='';
  for(const s of sents){
    if((cur+' '+s).length > max && cur){ out.push(cur); cur=s; }
    else cur = cur ? cur+' '+s : s;
  }
  if(cur) out.push(cur);
  return out.flatMap(c => c.length>max ? c.match(new RegExp('.{1,'+max+'}','gs')) : [c]);
}
async function translate(text){
  text = text.trim();
  if(!text) return '';
  const {sl, tl} = M(), key = sl+'|'+text;
  if(cache.has(key)) return cache.get(key);
  let res;
  try{
    res = (await Promise.all(splitBy(text, 1500).map(c => googleTr(c, sl, tl)))).join(' ');
  }catch(e){
    res = await myMemoryTr(text, sl, tl);
  }
  cache.set(key, res);
  return res;
}

async function translateAll(){
  const title = srcTitle.value.trim(), body = srcText.value;
  if(!title && !body.trim()){ lastOut={title:'',body:''}; showOut(); updateCounts(); return; }
  if(!navigator.onLine){ setStatus('📴 لا يوجد اتصال بالإنترنت — يمكنك الكتابة والحفظ، والترجمة تعمل عند عودة الاتصال.', true); return; }
  setStatus('⏳ جاري الترجمة...');
  const modeAtStart = mode;
  try{
    const paras = body.split('\n');
    const [tTitle, ...tParas] = await Promise.all([translate(title), ...paras.map(p => p.trim() ? translate(p) : Promise.resolve(''))]);
    if(modeAtStart !== mode) return;
    lastOut = {title:tTitle, body:tParas.join('\n')};
    showOut(); updateCounts();
    setStatus('✅ تمت الترجمة');
  }catch(e){
    setStatus('⚠️ تعذّرت الترجمة — تأكد من اتصال الإنترنت ثم اضغط "ترجم الآن".', true);
  }
}

function setStatus(msg, err){ statusEl.textContent = msg; statusEl.className = 'status' + (err?' err':''); }
function wc(s){ return ((s||'').trim().match(/\S+/g)||[]).length; }
function updateCounts(){
  const a = wc(srcTitle.value+' '+srcText.value), b = wc(lastOut.title+' '+lastOut.body);
  $('srcCount').textContent = mode==='ar-en' ? a+' كلمة' : a+' words';
  $('outCount').textContent = mode==='ar-en' ? b+' words' : b+' كلمة';
}
function schedule(){
  updateCounts();
  if(!$('auto').checked) return;
  clearTimeout(timer);
  timer = setTimeout(translateAll, 1200);
}
srcText.addEventListener('input', schedule);
srcTitle.addEventListener('input', schedule);
$('btnTranslate').onclick = translateAll;
window.addEventListener('online', () => { setStatus('🌐 عاد الاتصال'); translateAll(); });

/* ========== النطق (الإنجليزي دائماً) ========== */
function speak(text){
  if(!('speechSynthesis' in window)){ toast('المتصفح لا يدعم النطق'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=parseFloat($('rate').value);
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('en'));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
function englishText(){
  return mode==='ar-en' ? (lastOut.title+'. '+lastOut.body) : (srcTitle.value+'. '+srcText.value);
}
$('btnSpeakAll').onclick = () => { const t=englishText().trim(); if(t.length>2) speak(t); };
$('btnStop').onclick = () => window.speechSynthesis && speechSynthesis.cancel();

/* ========== وضع التعلّم ========== */
function sentences(text){
  return text.split(/(?<=[.!؟?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
}
async function buildLearn(){
  const sents = sentences((srcTitle.value ? srcTitle.value+'\n' : '') + srcText.value);
  const box = $('learnTable');
  if(!sents.length){ box.innerHTML='<div class="empty">لا يوجد نص بعد.</div>'; return; }
  box.innerHTML='<div class="empty">⏳ جاري تجهيز الجمل...</div>';
  try{
    const tr = await Promise.all(sents.map(translate));
    const m = M(), tbl = document.createElement('table');
    tbl.dir = 'rtl';
    sents.forEach((s,i)=>{
      const row = tbl.insertRow();
      row.innerHTML = `<td class="${m.srcDir}"></td><td class="tr ${m.outDir}"><span></span></td><td class="act"><button title="استماع">🔊</button></td>`;
      row.cells[0].textContent = s;
      row.cells[1].firstChild.textContent = tr[i];
      row.cells[1].firstChild.onclick = e => e.target.classList.toggle('shown');
      const en = mode==='ar-en' ? tr[i] : s;
      row.cells[2].firstChild.onclick = () => speak(en);
    });
    box.innerHTML=''; box.appendChild(tbl);
    applyHide();
  }catch(e){ box.innerHTML='<div class="empty">⚠️ تعذّرت الترجمة — تحقق من الإنترنت.</div>'; }
}
function applyHide(){ $('learnTable').classList.toggle('hide-tr', $('hideTr').checked); }
$('btnBuildLearn').onclick = buildLearn;
$('hideTr').onchange = applyHide;

/* ========== الحفظ ========== */
const KEY='ar_en_articles';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } }
function store(a){ try{ localStorage.setItem(KEY, JSON.stringify(a)); return true; }catch(e){ toast('تعذّر الحفظ في هذا المتصفح'); return false; } }
function save(){
  if(!srcTitle.value.trim() && !srcText.value.trim()){ toast('المقال فارغ'); return; }
  const all = load();
  const rec = {id: currentId || Date.now(), mode, srcTitle:srcTitle.value, srcText:srcText.value,
               outTitle:lastOut.title, outText:lastOut.body, date:new Date().toLocaleString('ar-OM')};
  const i = all.findIndex(a=>a.id===rec.id);
  if(i>=0) all[i]=rec; else all.unshift(rec);
  currentId = rec.id;
  if(store(all)){ toast('✅ تم الحفظ'); renderList(); }
}
function renderList(){
  const all = load(), box=$('savedList');
  if(!all.length){ box.innerHTML='<div class="empty">لا توجد مقالات محفوظة.</div>'; return; }
  box.innerHTML='';
  all.forEach(a=>{
    // دعم المقالات المحفوظة من النسخة الأولى
    if(!a.mode){ a.mode='ar-en'; a.srcTitle=a.arTitle; a.srcText=a.arText; a.outTitle=a.enTitle; a.outText=a.enText; }
    const d=document.createElement('div'); d.className='item';
    d.innerHTML=`<div><div class="t"></div><div class="d"></div></div><div><button>فتح</button> <button class="danger">حذف</button></div>`;
    d.querySelector('.t').textContent = (a.srcTitle || '(بدون عنوان)');
    d.querySelector('.d').textContent = (a.mode==='ar-en'?'عربي ← English':'English ← عربي') + ' — ' + a.date + ' — ' + wc(a.srcText) + ' كلمة';
    const [bo, bd] = d.querySelectorAll('button');
    bo.onclick = () => openArticle(a);
    bd.onclick = () => { if(bd.dataset.c){ store(load().filter(x=>x.id!==a.id)); if(currentId===a.id) currentId=null; renderList(); } else { bd.dataset.c=1; bd.textContent='تأكيد الحذف؟'; } };
    box.appendChild(d);
  });
}
function openArticle(a){
  mode = a.mode; currentId=a.id;
  srcTitle.value=a.srcTitle||''; srcText.value=a.srcText||'';
  lastOut={title:a.outTitle||'', body:a.outText||''};
  applyMode(); window.scrollTo({top:0,behavior:'smooth'}); toast('تم فتح المقال');
}
function newArticle(){
  currentId=null; srcTitle.value=''; srcText.value=''; lastOut={title:'',body:''};
  showOut();
  $('learnTable').innerHTML='<div class="empty">اكتب مقالك ثم اضغط "جهّز الجمل".</div>';
  updateCounts(); srcTitle.focus();
}
$('btnSave').onclick = save;
$('btnNew').onclick = newArticle;
setInterval(()=>{ try{ localStorage.setItem(KEY+'_draft', JSON.stringify({m:mode,t:srcTitle.value,b:srcText.value})); }catch(e){} }, 5000);

/* ========== النسخ والتصدير ========== */
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast('✅ تم النسخ'); }
  catch(e){ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); toast('✅ تم النسخ'); }
}
$('btnCopyOut').onclick = () => copy((lastOut.title? lastOut.title+'\n\n':'') + lastOut.body);
$('btnCopyBoth').onclick = () => copy(`${srcTitle.value}\n\n${srcText.value}\n\n--------------------\n\n${lastOut.title}\n\n${lastOut.body}`);

function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function paras(s){ return (s||'').split('\n').filter(p=>p.trim()).map(p=>`<p>${esc(p)}</p>`).join(''); }
function docHtml(){
  const m = M();
  return `<html><head><meta charset="utf-8"><title>${esc(srcTitle.value||'Article')}</title>
<style>body{font-family:Arial;margin:30px} .rtl{direction:rtl;text-align:right;font-size:16pt} .ltr{direction:ltr;text-align:left;font-family:Georgia;font-size:14pt} h1{font-size:20pt} hr{margin:30px 0}</style></head>
<body><div class="${m.srcDir}"><h1>${esc(srcTitle.value)}</h1>${paras(srcText.value)}</div><hr>
<div class="${m.outDir}"><h1>${esc(lastOut.title)}</h1>${paras(lastOut.body)}</div></body></html>`;
}
function download(name, content, type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+content],{type}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
}
const fname = () => (srcTitle.value.trim()||'مقال').replace(/[\\/:*?"<>|]/g,'').slice(0,50);
$('btnWord').onclick = () => download(fname()+'.doc', docHtml(), 'application/msword');
$('btnHtml').onclick = () => download(fname()+'.html', docHtml(), 'text/html');
$('btnPrint').onclick = () => window.print();

/* ========== التبويبات والتنبيهات ========== */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
  $('learnBox').style.display = b.dataset.tab==='learnBox'?'':'none';
  $('listBox').style.display  = b.dataset.tab==='listBox'?'':'none';
  if(b.dataset.tab==='listBox') renderList();
});
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }

/* ========== PWA: التثبيت والعمل بدون إنترنت ========== */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('btnInstall').style.display='inline-block'; });
$('btnInstall').onclick = async () => { if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt=null; $('btnInstall').style.display='none'; };
window.addEventListener('appinstalled', () => toast('✅ تم تثبيت التطبيق'));

/* ========== البدء ========== */
try{
  const d=JSON.parse(localStorage.getItem(KEY+'_draft'));
  if(d && (d.t||d.b)){ if(d.m) mode=d.m; srcTitle.value=d.t; srcText.value=d.b; }
}catch(e){}
applyMode();
if(srcTitle.value || srcText.value) translateAll();
</script>
</body>
